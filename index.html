<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Каталог товаров</title>
</head>
<body>
    <div class="buttons">
        <button class="change-color-card">Изменить цвет карточки</button>
        <button class="change-all-color-cards">Изменить цвет всех карточек</button>
        <button class="open-google">Открыть Google</button>
        <button class="output-console-log">Вывести сообщение в консоль</button>
        <button class="change-color-btn">Изменить цвет кнопки</button>
    </div>
    <h1 class="title">Выбери свой продукт</h1>
    <ul class="products"></ul>

    <template id="product-template">
        <li class="product-list">
            <div class="card">
                <img class="card__image" src="" alt="">
                <span class="card__text"></span>
                <h2 class="card__title"></h2>
                <p class="card__description"></p>
                <div class="card__compound compound">
                    <span>Состав:</span>
                    <ul class="compound__list"></ul>
                </div>
                <div class="card__price price">
                    <b>Цена</b>
                    <span class="price__tag"></span>
                </div>
            </div>
        </li>
    </template>

    <script src="./src/js/main.js"></script>
    <script src="./src/js/homework-8.js"></script>
    <script type="module" src="./src/js/homework-9.js"></script>
    <script type="module" src="./src/js/homework-10.js"></script>
</body>
</html>
